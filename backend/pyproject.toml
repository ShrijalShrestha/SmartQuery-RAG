[project]
name = "backend"
version = "0.1.0"
description = "Modernized RAG System for document parsing, embedding, and semantic search"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv",
    "pinecone",
    "pinecone-text",
    "sentence-transformers",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "requests",
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-google-genai",
    "langchain-pinecone",
    "langchain-huggingface>=0.3.1",
    "pymupdf",
    "python-docx",
    "unstructured[docx,pdf]",
    "numpy",
    "transformers",
    "torch",
    "tiktoken",
]

[tool.setuptools.packages.find]
exclude = ["data*", "hf_models_cache*"]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
]
